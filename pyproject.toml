[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-commerce-mcp-server"
version = "0.1.0"
description = "MCP Server for agent commerce — how AI agents create, compare, and track purchases"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "AiAgentKarl"}]
keywords = ["mcp", "commerce", "ai-agent", "purchasing", "e-commerce"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/AiAgentKarl/agent-commerce-mcp-server"
Repository = "https://github.com/AiAgentKarl/agent-commerce-mcp-server"
Issues = "https://github.com/AiAgentKarl/agent-commerce-mcp-server/issues"

[project.scripts]
agent-commerce = "src.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
